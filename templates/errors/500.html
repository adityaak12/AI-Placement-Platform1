{% extends "base.html" %}

{% block title %}Server Error - 500{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 py-5">
            <h1 class="display-1 fw-bold text-danger">500</h1>
            <h3 class="fw-bold mb-3">Internal Server Error</h3>
            <p class="text-secondary mb-4">Something went wrong while processing your request. Please try again or return to the dashboard.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
