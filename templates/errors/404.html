{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 py-5">
            <h1 class="display-1 fw-bold text-primary">404</h1>
            <h3 class="fw-bold mb-3">Page Not Found</h3>
            <p class="text-secondary mb-4">The page or assessment you are looking for does not exist or has been moved.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
